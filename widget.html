<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeris weather widget</title>
<meta name="robots" content="noindex">
<style>
  /* Aeris embeddable widget. Usage: widget.html?lat=28.61&lon=77.21&name=New%20Delhi&style=card|strip&theme=sky|dark|light&unit=C|F */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a.w { position: relative; display: block; height: 100%; overflow: hidden; color: #fff; text-decoration: none; border-radius: 22px; background: linear-gradient(180deg, var(--a), var(--b) 55%, var(--c)); isolation: isolate; }
  a.w::before { content: ''; position: absolute; inset: -40%; z-index: -1; background: radial-gradient(closest-side, var(--g), transparent 70%) 70% 25% / 60% 60% no-repeat; opacity: .55; animation: drift 14s ease-in-out infinite alternate; }
  a.w::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.12); pointer-events: none; }
  @keyframes drift { to { transform: translate(-12%, 8%) scale(1.15); } }
  .dark a.w { --a: #11131a; --b: #171a24; --c: #1f2433; --g: rgba(120,140,255,.35); }
  .light a.w { --a: #f4f7fb; --b: #eef2f8; --c: #e2e9f3; --g: rgba(255,200,90,.45); color: #10203a; }
  a.w.card { padding: 16px 18px; display: grid; grid-template-rows: auto 1fr auto; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 600; }
  .top span { opacity: .72; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .mid { display: flex; align-items: center; justify-content: space-between; }
  .t { font-size: 64px; font-weight: 200; line-height: 1; letter-spacing: -.04em; }
  .ic { width: 64px; height: 64px; }
  .ic svg { width: 100%; height: 100%; }
  .bot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 14px; font-weight: 600; }
  .bot small { display: block; opacity: .72; font-size: 12px; font-weight: 500; margin-top: 2px; }
  .brand { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; opacity: .8; }
  .brand i { width: 11px; height: 11px; border-radius: 50%; background: conic-gradient(#FFD60A, #fff, #64D2FF, #FFD60A); }
  a.w.strip { display: flex; align-items: center; gap: 12px; padding: 0 16px 0 10px; border-radius: 18px; }
  .strip .ic { width: 46px; height: 46px; flex: none; }
  .strip .t { font-size: 34px; }
  .strip .who { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .who small { display: block; opacity: .72; font-size: 12px; font-weight: 500; }
  .msg { display: grid; place-items: center; height: 100%; padding: 12px; font-size: 13px; text-align: center; }
  .rays { transform-box: fill-box; transform-origin: center; animation: spin 22s linear infinite; }
  .drop { animation: drop 1.3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drop { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(7px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFEA80"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
  <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#D3DEEB"/></linearGradient>
  <linearGradient id="gM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFCEB"/><stop offset="1" stop-color="#E3DCB8"/></linearGradient>
  <mask id="mM" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><circle cx="41" cy="24" r="13" fill="#000"/></mask>
</defs></svg>
<div id="root" style="height:100%"><div class="msg">Loading weather…</div></div>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const lat = +q.get('lat'), lon = +q.get('lon'), name = q.get('name') || 'Weather', style = q.get('style') === 'strip' ? 'strip' : 'card';
  const theme = ['sky', 'dark', 'light'].includes(q.get('theme')) ? q.get('theme') : 'sky', unit = q.get('unit') === 'F' ? 'F' : 'C';
  const root = document.getElementById('root');
  document.body.className = theme;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const T = c => Math.round(unit === 'C' ? c : c * 9 / 5 + 32);
  const LABEL = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Cloudy', 45: 'Foggy', 48: 'Freezing fog', 51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 80: 'Showers', 81: 'Showers', 82: 'Heavy showers', 95: 'Thunderstorms', 96: 'Thunderstorms', 99: 'Thunderstorms' };
  const kind = c => (c === 0 ? 'clear' : c <= 2 ? 'partly' : c === 3 ? 'cloud' : c <= 48 ? 'fog' : (c <= 67 || (c >= 80 && c <= 82)) ? 'rain' : c <= 86 ? 'snow' : 'storm');
  const SKY = { 'clear-d': ['#1C5FC4', '#3D8BE8', '#7DB9F3', 'rgba(255,214,120,.8)'], 'clear-n': ['#050A1C', '#0E1838', '#24336A', 'rgba(165,180,255,.5)'], 'cloud-d': ['#4A6585', '#6E89A7', '#A6B9CD', 'rgba(255,255,255,.5)'], 'cloud-n': ['#0C121D', '#1A2434', '#334359', 'rgba(160,180,210,.35)'], 'rain-d': ['#2C3D50', '#475C72', '#72879D', 'rgba(100,210,255,.45)'], 'rain-n': ['#080D15', '#131D2A', '#243349', 'rgba(90,200,250,.35)'], 'snow-d': ['#6C8AAD', '#9AB1CB', '#D2DEEB', 'rgba(255,255,255,.6)'], 'snow-n': ['#121A29', '#283950', '#4A5F7F', 'rgba(215,230,255,.4)'], 'fog-d': ['#5B6571', '#838D98', '#B4BCC4', 'rgba(255,255,255,.4)'], 'fog-n': ['#121519', '#242931', '#3C434E', 'rgba(200,205,215,.3)'], 'storm-d': ['#1D1F31', '#353853', '#5A5478', 'rgba(191,90,242,.45)'], 'storm-n': ['#08080E', '#141529', '#2A2446', 'rgba(191,90,242,.4)'] };
  const rays = Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a); return `<line x1="${32 + c * 16}" y1="${32 + s * 16}" x2="${32 + c * 22}" y2="${32 + s * 22}"/>`; }).join('');
  const CL = '<circle cx="24" cy="36" r="10"/><circle cx="36" cy="30" r="13"/><circle cx="46" cy="38" r="8"/><rect x="18" y="36" width="32" height="10" rx="5"/>';
  const sun = tr => `<g transform="${tr}"><g class="rays" stroke="#FFD60A" stroke-width="3.4" stroke-linecap="round">${rays}</g><circle cx="32" cy="32" r="11" fill="url(#gS)"/></g>`;
  const moon = tr => `<g transform="${tr}"><circle cx="30" cy="34" r="17" fill="url(#gM)" mask="url(#mM)"/></g>`;
  const cloud = (tr = '', f = 'url(#gC)') => `<g transform="${tr}" fill="${f}">${CL}</g>`;
  function icon(k, day) {
    let b;
    if (k === 'clear') b = day ? sun('') : moon('');
    else if (k === 'partly') b = (day ? sun('translate(-4 -6) scale(.8)') : moon('translate(-2 -6) scale(.78)')) + cloud('translate(5 7)');
    else if (k === 'rain') b = cloud('translate(0 -4)') + '<g stroke="#64D2FF" stroke-width="3.2" stroke-linecap="round"><line class="drop" x1="24" y1="50" x2="22" y2="56"/><line class="drop" style="animation-delay:.4s" x1="34" y1="50" x2="32" y2="56"/><line class="drop" style="animation-delay:.8s" x1="44" y1="50" x2="42" y2="56"/></g>';
    else if (k === 'snow') b = cloud('translate(0 -4)') + '<g fill="#fff"><circle cx="24" cy="54" r="2.6"/><circle cx="34" cy="57" r="2.6"/><circle cx="44" cy="54" r="2.6"/></g>';
    else if (k === 'storm') b = cloud('translate(0 -6)', '#8E99AB') + '<path d="M35 40 l-8 12 h7 l-4 10 l12 -14 h-7 l5 -8 z" fill="#FFD60A"/>';
    else if (k === 'fog') b = cloud('translate(0 -8)') + '<g stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="14" y1="48" x2="46" y2="48"/><line x1="20" y1="55" x2="52" y2="55"/></g>';
    else b = cloud('translate(14 -6) scale(.72)', '#C9D3DF') + cloud();
    return `<svg viewBox="0 0 64 64" aria-hidden="true">${b}</svg>`;
  }
  const appUrl = () => { const u = new URL('./', location.href); u.search = new URLSearchParams({ lat, lon, name }).toString(); return u.toString(); };
  function load() {
    if (!isFinite(lat) || !isFinite(lon)) { root.innerHTML = '<div class="msg">This widget needs a lat and lon in its address.</div>'; return; }
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=1&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min`)
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(d => {
        const c = d.current, k = kind(c.weather_code), day = c.is_day === 1, sky = SKY[(k === 'partly' ? 'clear' : k) + '-' + (day ? 'd' : 'n')];
        const t = c.time.slice(11, 16).split(':'), h = +t[0], time = `${h % 12 || 12}:${t[1]} ${h >= 12 ? 'PM' : 'AM'}`;
        const vars = theme === 'sky' ? `--a:${sky[0]};--b:${sky[1]};--c:${sky[2]};--g:${sky[3]}` : '';
        const hl = `H ${T(d.daily.temperature_2m_max[0])}°  L ${T(d.daily.temperature_2m_min[0])}°`, label = LABEL[c.weather_code] || 'Weather';
        root.innerHTML = style === 'card'
          ? `<a class="w card" style="${vars}" href="${esc(appUrl())}" target="_blank" rel="noopener" aria-label="${esc(name)}: ${T(c.temperature_2m)} degrees, ${label}. Open the full forecast in Aeris.">
              <div class="top">${esc(name)}<span>${time}</span></div>
              <div class="mid"><div class="t">${T(c.temperature_2m)}°</div><div class="ic">${icon(k, day)}</div></div>
              <div class="bot"><div>${label}<small>${hl}</small></div><span class="brand"><i></i>Aeris</span></div></a>`
          : `<a class="w strip" style="${vars}" href="${esc(appUrl())}" target="_blank" rel="noopener" aria-label="${esc(name)}: ${T(c.temperature_2m)} degrees, ${label}. Open the full forecast in Aeris.">
              <div class="ic">${icon(k, day)}</div><div class="t">${T(c.temperature_2m)}°</div>
              <div class="who">${esc(name)}<small>${label}, ${hl}</small></div><span class="brand"><i></i>Aeris</span></a>`;
      })
      .catch(() => { if (!root.querySelector('a')) root.innerHTML = '<div class="msg">Weather is unavailable right now.</div>'; });
  }
  load();
  setInterval(load, 30 * 60 * 1000);
})();
</script>
</body>
</html>
